id: "S0-01"
stage: "s0"
title: "机器人全栈地图：从座舱指令到电磁阀"
durationMin: 30
type: "teach"
output: "手绘数据流图"
tags: ["架构", "数据流"]
sources: ["E_ROS与Linux命令手册", "C_现场踩坑"]
quiz:
  - q: "推杆动作但车端没有任何响应，最先应该怀疑哪一层？"
    options:
      - "L5 业务界面"
      - "L1 执行与电气（供电/使能/急停）"
      - "L4 控制算法"
      - "L3 中间件"
    answer: 1
    explain: "无任何动作时先确认供电、使能和急停回路，再往上层排查。"
  - q: "为什么指令除了数值还需要时间戳？"
    options:
      - "为了让日志好看"
      - "接收端要判断这条指令是否过期"
      - "时间戳会提高 CAN 波特率"
      - "时间戳是 CAN 帧的必填字段"
    answer: 1
    explain: "没有时间戳无法判断旧值是否仍有效，容易造成延迟动作或误动作。"
  - q: "「松手后仍继续动」最可能缺少什么？"
    options:
      - "更高的 PWM 频率"
      - "反馈闭环与使能状态机"
      - "更长的线束"
      - "更大的保险"
    answer: 1
    explain: "通常是没有反馈或状态机未退出使能，系统仍按最后指令执行。"
