id: "S0-07"
stage: "s0"
title: "机器人四层架构与数据流"
durationMin: 30
type: "teach"
output: "分层排障练习"
tags: ["架构", "排障"]
sources: ["C_现场踩坑", "E_ROS与Linux命令手册"]
quiz:
  - q: "把故障范围从「整车」缩到「一层」，最有效的第一步是？"
    options:
      - "先换怀疑的零件"
      - "找最靠近故障的已知正常点"
      - "重装整个系统"
      - "从两端同时修改"
    answer: 1
    explain: "已知正常点是定界的锚，没有锚就无法在中间二分。"
  - q: "控制周期 10ms、输入采样 50Hz，控制节点正确的处理方式是？"
    options:
      - "每个控制周期都发一次新指令"
      - "保持上次值并加超时保护"
      - "降低算法频率到 50Hz"
      - "忽略输入刷新"
    answer: 1
    explain: "输入比控制慢时必须保持上次值，同时用超时判据发现输入断流。"
  - q: "「排障卡上写了结论但没有命令输出或截图」，问题在于？"
    options:
      - "格式不美观"
      - "换班后无法复盘，结论不可追溯"
      - "命令太多"
      - "没有问题，结论本来就够了"
    answer: 1
    explain: "每条判断都要有证据来源，否则等于凭记忆下结论。"
