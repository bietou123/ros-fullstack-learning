id: "S0-04"
stage: "s0"
title: "网络：IP / 路由 / 端口 / SSH / 防火墙"
durationMin: 40
type: "teach"
output: "跨机连通实验"
tags: ["网络", "SSH"]
sources: ["E_ROS与Linux命令手册"]
experiment:
  id: "s0-04-network"
  ros: "none"
  commands:
    - "ip -br addr"
    - "ip route"
    - "ping -c 2 -W 1 127.0.0.1"
    - "ss -tlnp | head -n 5"
    - "ssh -V"
  checks:
    - "ip -br addr | grep -q 'UP'"
    - "ip route | grep -q 'default'"
    - "ping -c 2 -W 1 127.0.0.1"
  timeoutSec: 60
  headless: true
quiz:
  - q: "服务日志显示 listening on 127.0.0.1:8080，远程客户端连不上。最可能的原因是？"
    options:
      - "客户端防火墙太严"
      - "服务只绑定回环地址，未监听外部网卡"
      - "8080 端口被保留"
      - "需要重新生成 SSH 密钥"
    answer: 1
    explain: "127.0.0.1 只接受本机连接，远程连接无法到达。"
  - q: "`192.0.2.10/24` 与 `192.0.2.20/24` 的关系是？"
    options:
      - "不同网段，必须经网关"
      - "同一网段，可直接通信"
      - "必须用 IPv6 才能互通"
      - "取决于 DNS"
    answer: 1
    explain: "/24 的前三段相同即同一子网。"
  - q: "排障「连不上」的正确顺序是？"
    options:
      - "先改密码，再看网线"
      - "地址 → 通路 → 端口 → 应用认证"
      - "先重装系统"
      - "先抓包再说"
    answer: 1
    explain: "从下往上逐层排除，避免在错误层浪费时间。"
  - q: "SSH 免密登录失败提示 `Permission denied (publickey)`，以下哪项不是常见原因？"
    options:
      - "公钥没追加到目标机 authorized_keys"
      - "家目录或 .ssh 权限过宽"
      - "私钥权限不是 600"
      - "客户端没有安装图形界面"
    answer: 3
    explain: "SSH 免密与图形界面无关；前三项是常见原因。"
