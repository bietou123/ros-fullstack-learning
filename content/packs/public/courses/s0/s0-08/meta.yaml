id: "S0-08"
stage: "s0"
title: "安全底线：急停、看门狗、权限边界"
durationMin: 30
type: "teach"
output: "安全检查表"
tags: ["安全", "看门狗"]
sources: ["C_现场踩坑", "03-安全设计与状态机.md"]
quiz:
  - q: "为什么软件急停不能替代硬件急停？"
    options:
      - "软件急停太慢"
      - "断链时软件急停本身也失效，而这正是最需要停车的场景"
      - "软件急停不能记录日志"
      - "硬件急停更便宜"
    answer: 1
    explain: "软件急停依赖链路，链路断时它一起失效。"
  - q: "看门狗超时触发后，最关键的必须行为是？"
    options:
      - "写一条日志"
      - "输出归零并停止动作"
      - "自动重启节点"
      - "发邮件通知"
    answer: 1
    explain: "只报警不停车等于没有看门狗。"
  - q: "SSH 私钥文件权限设置为 777 的主要风险是？"
    options:
      - "SSH 会变慢"
      - "同机任何账号都能读取私钥并冒充你登录"
      - "会导致系统崩溃"
      - "没有风险"
    answer: 1
    explain: "私钥泄漏即设备被接管，必须保持 600。"
