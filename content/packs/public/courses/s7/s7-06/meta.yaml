      - "永远不变"
      - "只有二维墙线"
      - "由云平台自动保持最新"
    answer: 0
    explain: "堆料、施工进度都会改变环境。"
  - q: "把室内导航的速度与膨胀半径直接搬到工地，最大风险是？"
    options:
      - "制动距离与安全余量不足"
      - "地图分辨率过高"
      - "通信带宽浪费"
      - "定位频率下降"
    answer: 0
    explain: "质量大、惯性大、地面湿滑都会拉长制动距离。"
  - q: "工地定位方案更合理的设计是？"
    options:
      - "多传感器融合，并设计 GNSS 失锁降级策略"
      - "只依赖单目相机"
      - "只依赖 GNSS"
      - "完全不需要定位"
    answer: 0
    explain: "单一来源在工地环境下容易失效。"
