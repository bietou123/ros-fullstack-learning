id: "S9-02"
stage: "s9"
title: "Edge Bridge 配置优先级"
durationMin: 35
type: "teach"
output: "配置覆盖实验"
tags: ["配置", "优先级", "排障"]
sources: ["02_架构与协议", "06_软件部署与运维", "C_现场踩坑"]
experiment:
  id: "s9-02-config-merge"
  ros: "none"
  commands:
    - "python3 -c \"base={'rate':10,'topic':'/cmd','mode':'normal'}; file={'rate':20}; env={'mode':'safe'}; cli={'topic':'/cmd_remote'}; cfg={**base,**file,**env,**cli}; print(cfg)\""
  checks:
    - "python3 -c \"base={'rate':10,'topic':'/cmd','mode':'normal'}; file={'rate':20}; env={'mode':'safe'}; cli={'topic':'/cmd_remote'}; cfg={**base,**file,**env,**cli}; assert cfg['rate']==20 and cfg['topic']=='/cmd_remote' and cfg['mode']=='safe'; print('CONFIG_OK')\""
  timeoutSec: 60
  headless: true
quiz:
  - q: "改了配置文件但参数没变，最常见的原因是？"
    options:
      - "被更高优先级的层（环境变量/命令行）覆盖"
      - "配置文件格式一定错误"
      - "程序没有读取配置的能力"
      - "磁盘损坏"
    answer: 0
    explain: "分层配置里，高层会覆盖低层；先打印生效值与来源。"
  - q: "对象配置做深度合并时，数组通常应该？"
    options:
      - "整体替换，而不是逐项追加"
      - "自动去重合并"
      - "忽略不处理"
      - "随机保留"
    answer: 0
    explain: "数组替换是多数配置系统的默认行为，必须写进文档避免误解。"
  - q: "启动时打印「生效值 + 来源层」的主要目的是？"
    options:
      - "让排障时能直接定位是哪一层在起作用"
      - "让日志更长"
      - "提高启动速度"
      - "加密配置"
    answer: 0
    explain: "只有值没有来源，仍然只能靠猜。"
