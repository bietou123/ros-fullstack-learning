quiz:
  - q: "核对设备配置时，最容易被忽略的是？"
    options:
      - "环境变量/命令行对配置文件的覆盖"
      - "设备外观"
      - "机柜颜色"
      - "键盘布局"
    answer: 0
    explain: "配置文件写对了不代表生效值对，必须看最终生效值与来源。"
  - q: "公开共享的配置部署表应该怎样处理敏感信息？"
    options:
      - "设备编号、IP、账号等全部改为占位符"
      - "只隐藏密码，其余保留"
      - "截图后拼接"
      - "直接共享原件"
    answer: 0
    explain: "序列号、网段、客户信息同样属于敏感信息。"
  - q: "一份完整的变更记录必须包含？"
    options:
      - "时间、操作人、改动、原因与回滚点"
      - "只有最终版本号"
      - "只有操作人姓名"
      - "只有一句「已优化」"
    answer: 0
    explain: "没有回滚点的变更记录无法支撑故障恢复。"
