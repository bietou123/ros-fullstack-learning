id: "S2-08"
stage: "s2"
title: "ROS1→ROS2 迁移与 bridge"
durationMin: 45
type: "teach"
output: "迁移对照表"
tags: ["迁移", "ros1_bridge"]
sources: ["E_ROS与Linux命令手册", "C_现场踩坑"]
experiment:
  id: "s2-08-bridge"
  ros: "ros2"
  image: "ros:humble-ros-base"
  network: "host"
  commands:
    - "bash -lc 'source /opt/ros/humble/setup.bash && ros2 pkg list | grep -c ros1_bridge; true'"
    - "bash -lc 'source /opt/ros/humble/setup.bash && ros2 pkg list | head -n 5'"
  checks:
    - "bash -lc 'source /opt/ros/humble/setup.bash && test -n \"$(ros2 pkg list)\"'"
    - "bash -lc 'source /opt/ros/humble/setup.bash && ! ros2 pkg list | grep -qx ros1_bridge && ! test -f /opt/ros/noetic/setup.bash'"
  timeoutSec: 300
  headless: true
quiz:
  - q: "生产环境上 ros1_bridge 应该用哪种模式？"
    options:
      - "动态桥（按需加载）"
      - "静态桥（编译期固定消息对）"
      - "两者一样"
      - "都不用"
    answer: 1
    explain: "动态桥在运行时加载类型，会引入不可预测延迟。"
  - q: "ros1_bridge 不能直接桥接的是？"
    options:
      - "标准话题"
      - "服务（默认不支持，需要额外处理）"
      - "自定义消息"
      - "TF"
    answer: 1
    explain: "默认只桥话题，服务需自行实现。"
  - q: "迁移中最稳妥的顺序是？"
    options:
      - "先迁核心算法"
      - "先迁只读数据，再迁控制输出，最后迁核心算法"
      - "一次性全迁"
      - "先删掉 ROS1"
    answer: 1
    explain: "从风险最低的只读链路开始，每步保留回滚方案。"
