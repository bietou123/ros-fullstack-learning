id: "S2-07"
stage: "s2"
title: "ros2 bag 与诊断"
durationMin: 30
type: "teach"
output: "回放排障"
tags: ["rosbag2", "诊断"]
sources: ["C_现场踩坑", "E_ROS与Linux命令手册"]
experiment:
  id: "s2-07-bag"
  ros: "ros2"
  image: "ros:humble-ros-base"
  network: "host"
  commands:
    - "bash -lc 'source /opt/ros/humble/setup.bash && (timeout 14 ros2 topic pub -r 20 /rl_demo std_msgs/msg/String \"{data: x}\" >/dev/null 2>&1 &) && sleep 3 && timeout 5 ros2 bag record -o /tmp/demo /rl_demo; ros2 bag info /tmp/demo; true'"
    - "bash -lc 'source /opt/ros/humble/setup.bash && (timeout 12 ros2 topic pub -r 20 /rl_demo std_msgs/msg/String \"{data: x}\" >/dev/null 2>&1 & echo $! >/tmp/pub.pid) && sleep 3 && timeout 5 ros2 bag record -o /tmp/demo /rl_demo; ros2 bag info /tmp/demo; kill $(cat /tmp/pub.pid) 2>/dev/null || true; sleep 1; (timeout 10 ros2 bag play /tmp/demo >/tmp/play.log 2>&1 &); sleep 1; timeout 8 ros2 topic echo --once /rl_demo'"
  checks:
    - "bash -lc 'source /opt/ros/humble/setup.bash && ros2 bag --help 2>&1 | grep -q record'"
    - "bash -lc 'source /opt/ros/humble/setup.bash && (timeout 10 ros2 topic pub -r 20 /rl_demo std_msgs/msg/String \"{data: x}\" >/dev/null 2>&1 & echo $! >/tmp/pub.pid) && sleep 3 && timeout 4 ros2 bag record -o /tmp/demo /rl_demo; kill $(cat /tmp/pub.pid) 2>/dev/null || true; sleep 1; (timeout 8 ros2 bag play /tmp/demo >/tmp/play.log 2>&1 &); sleep 1; timeout 6 ros2 topic echo --once /rl_demo | grep -q data:'"
  timeoutSec: 300
  headless: true
quiz:
  - q: "ROS2 bag 的数据文件与元数据分别是？"
    options:
      - "demo.db3 与 metadata.yaml"
      - "demo.bag 与 index"
      - "demo.json 与 demo.txt"
      - "只有 demo.db3"
    answer: 0
    explain: "两个文件必须一起拷贝，缺 metadata 基本无法使用。"
  - q: "录制 transient_local 话题的历史消息，需要？"
    options:
      - "什么都不用做"
      - "用 --qos-profile-overrides-path 指定匹配的 QoS"
      - "加 --all 即可"
      - "重装 rosbag2"
    answer: 1
    explain: "默认订阅 QoS 不匹配时，录不到历史数据。"
  - q: "回放后订阅端收不到数据，首先检查？"
    options:
      - "磁盘空间"
      - "回放端与订阅端的 QoS 是否兼容"
      - "网线"
      - "CPU 温度"
    answer: 1
    explain: "ROS2 的 QoS 不兼容是静默失败。"
